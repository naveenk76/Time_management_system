{% extends "base.html" %}
{% block content %}
<h2>Task Details</h2>
<div class="card">
    <div class="card-body">
        <h5 class="card-title">{{ task.title }}</h5>
        <p class="card-text">{{ task.description }}</p>
        <p class="card-text"><strong>Due:</strong> {{ task.due_date.strftime('%Y-%m-%d %H:%M') }}</p>
        <a href="{{ url_for('edit_task', task_id=task.id) }}" class="btn btn-warning btn-sm">Edit</a>
        <a href="{{ url_for('delete_task', task_id=task.id) }}" class="btn btn-danger btn-sm">Delete</a>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-sm">Back</a>
    </div>
</div>
{% endblock %}
